<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comprobante interno · ModasLa34</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <style>
    body { background:#f5f3ef; }
    .ticket { font-family: 'Courier New', monospace; }
    @media print {
      body { background:#fff; }
      .no-print { display:none !important; }
      #ticket { box-shadow:none !important; margin:0 !important; }
    }
  </style>
</head>
<body class="min-h-screen text-stone-800">
  <div class="max-w-md mx-auto p-4">
    <div class="no-print flex flex-wrap gap-2 mb-4 text-sm">
      <a href="ventas.html" class="px-3 py-2 rounded bg-stone-200 hover:bg-stone-300">← Caja</a>
      <button id="btnTicket" class="px-3 py-2 rounded bg-stone-900 text-white hover:bg-stone-700">PDF ticket 80 mm</button>
      <button id="btnA4" class="px-3 py-2 rounded bg-stone-700 text-white hover:bg-stone-600">PDF A4</button>
      <button id="btnImprimir" class="px-3 py-2 rounded border border-stone-400 hover:bg-white">Imprimir</button>
      <button id="btnWhatsapp" class="px-3 py-2 rounded bg-emerald-700 text-white hover:bg-emerald-600">WhatsApp</button>
    </div>
    <div id="estado" class="no-print text-sm text-stone-500 mb-2">Cargando comprobante…</div>
    <div id="ticket" class="ticket bg-white shadow-md p-5 text-xs leading-relaxed hidden"></div>
  </div>

  <script type="module" src="../js/factura.js"></script>
</body>
</html>
