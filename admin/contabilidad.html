<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contabilidad · ModasLa34</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#f5f3ef; }
    .toast { animation: in .2s ease-out; }
    @keyframes in { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
    .tab-on { background:#1c1917; color:#fff; }
  </style>
</head>
<body class="min-h-screen text-stone-800">
  <header class="bg-stone-900 text-stone-100">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-semibold tracking-wide">ModasLa34 · Contabilidad</h1>
        <p class="text-xs text-stone-400">Compras, gastos, asientos y reportes</p>
      </div>
      <nav class="flex gap-2 text-sm">
        <a href="ventas.html" class="px-3 py-1.5 rounded bg-stone-700 hover:bg-stone-600">Caja</a>
        <a href="dashboard.html" class="px-3 py-1.5 rounded bg-stone-700 hover:bg-stone-600">Panel</a>
      </nav>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 pt-4">
    <div id="tabs" class="flex flex-wrap gap-1 text-sm">
      <button data-tab="resumen" class="px-3 py-1.5 rounded bg-white border">Resumen</button>
      <button data-tab="compras" class="px-3 py-1.5 rounded bg-white border">Compras</button>
      <button data-tab="gastos" class="px-3 py-1.5 rounded bg-white border">Gastos</button>
      <button data-tab="proveedores" class="px-3 py-1.5 rounded bg-white border">Proveedores</button>
      <button data-tab="asientos" class="px-3 py-1.5 rounded bg-white border">Asientos</button>
      <button data-tab="plan" class="px-3 py-1.5 rounded bg-white border">Plan de cuentas</button>
      <button data-tab="reportes" class="px-3 py-1.5 rounded bg-white border">Reportes</button>
      <button data-tab="periodos" class="px-3 py-1.5 rounded bg-white border">Periodos</button>
    </div>
  </div>

  <main id="vista" class="max-w-7xl mx-auto p-4"><p class="text-stone-500">Cargando…</p></main>

  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-start justify-center p-4 z-40 overflow-y-auto">
    <div class="bg-white rounded-xl max-w-3xl w-full my-8 p-5" id="modalBody"></div>
  </div>
  <div id="toasts" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

  <script type="module" src="../js/contabilidad/contabilidad.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../js/sw.js').catch(()=>{});</script>
</body>
</html>
