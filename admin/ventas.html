<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta Rápida - Modas La 34</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: #fff;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
            position: sticky; top: 0; z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; }
        .volver-btn {
            background: #f3f4f6; color: #4b5563; text-decoration: none;
            padding: 0.5rem 1rem; border-radius: 8px; font-size: 0.85rem;
        }
        .volver-btn:hover { background: #e5e7eb; }

        /* Layout */
        .venta-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 1.25rem;
            padding: 1.25rem;
            max-width: 1400px;
            margin: 0 auto;
            align-items: start;
        }

        .panel {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 1.25rem;
        }

        /* Productos */
        .productos-panel h2, .carrito-panel h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .buscador {
            display: flex; gap: 0.5rem; margin-bottom: 0.75rem;
        }
        .buscador input {
            flex: 1; padding: 0.65rem 0.9rem;
            border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 0.9rem; font-family: inherit;
        }
        .buscador input:focus {
            outline: none; border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .categorias {
            display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.75rem;
        }
        .cat-btn {
            background: #f3f4f6; border: 1px solid transparent;
            padding: 0.4rem 0.85rem; border-radius: 20px;
            font-size: 0.8rem; cursor: pointer; font-family: inherit;
            transition: all 0.15s;
        }
        .cat-btn:hover { background: #e5e7eb; }
        .cat-btn.active { background: #2563eb; color: #fff; }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.6rem;
            max-height: calc(100vh - 260px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .producto-card {
            background: #fff; border: 1px solid #e5e7eb;
            border-radius: 10px; padding: 0.75rem;
            cursor: pointer; transition: all 0.15s;
            display: flex; flex-direction: column; gap: 0.25rem;
        }
        .producto-card:hover {
            border-color: #2563eb;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.12);
            transform: translateY(-1px);
        }
        .producto-card:active { transform: scale(0.98); }
        .producto-nombre {
            font-weight: 600; font-size: 0.85rem;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .producto-precio { color: #059669; font-weight: 700; font-size: 0.95rem; }
        .producto-stock { font-size: 0.7rem; color: #6b7280; }
        .producto-stock.bajo { color: #dc2626; font-weight: 600; }
        .producto-codigo { font-size: 0.7rem; color: #9ca3af; }

        /* Carrito */
        .carrito-panel { position: sticky; top: 80px; }

        .carrito-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 0.75rem;
            padding-bottom: 0.75rem; border-bottom: 1px solid #e5e7eb;
        }
        .carrito-badge {
            background: #2563eb; color: #fff;
            padding: 0.15rem 0.55rem; border-radius: 12px;
            font-size: 0.75rem; font-weight: 600;
        }

        .iva-selector {
            background: #f9fafb; border-radius: 8px;
            padding: 0.6rem; margin-bottom: 0.75rem;
        }
        .iva-selector label {
            font-size: 0.75rem; color: #6b7280;
            display: block; margin-bottom: 0.4rem; font-weight: 500;
        }
        .iva-opciones { display: flex; gap: 0.4rem; }
        .iva-opcion {
            flex: 1; text-align: center; padding: 0.4rem;
            background: #fff; border: 1px solid #d1d5db;
            border-radius: 6px; cursor: pointer;
            font-size: 0.8rem; transition: all 0.15s;
        }
        .iva-opcion.active {
            background: #2563eb; color: #fff; border-color: #2563eb;
        }

        .carrito-items {
            max-height: 320px; overflow-y: auto;
            margin-bottom: 0.75rem;
        }
        .carrito-vacio {
            text-align: center; color: #9ca3af;
            padding: 2rem 1rem; font-size: 0.85rem;
        }
        .carrito-item {
            display: flex; align-items: center;
            gap: 0.5rem; padding: 0.6rem;
            background: #f9fafb; border-radius: 8px;
            margin-bottom: 0.4rem;
        }
        .item-info { flex: 1; min-width: 0; }
        .item-nombre {
            font-weight: 600; font-size: 0.8rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-detalle { font-size: 0.7rem; color: #6b7280; }
        .item-cantidad {
            display: flex; align-items: center; gap: 0.25rem;
        }
        .item-cantidad button {
            width: 24px; height: 24px; border-radius: 6px;
            border: 1px solid #d1d5db; background: #fff;
            cursor: pointer; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .item-cantidad button:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
        .item-cantidad span {
            min-width: 20px; text-align: center;
            font-weight: 600; font-size: 0.8rem;
        }
        .item-precio {
            font-weight: 700; color: #059669;
            font-size: 0.8rem; min-width: 60px; text-align: right;
        }
        .item-eliminar {
            background: none; border: none;
            color: #9ca3af; cursor: pointer; padding: 0.25rem;
        }
        .item-eliminar:hover { color: #dc2626; }

        .carrito-resumen { border-top: 1px solid #e5e7eb; padding-top: 0.75rem; }
        .resumen-linea {
            display: flex; justify-content: space-between;
            margin-bottom: 0.4rem; font-size: 0.85rem; color: #4b5563;
        }
        .resumen-total {
            display: flex; justify-content: space-between;
            font-size: 1.15rem; font-weight: 700; color: #059669;
            margin: 0.6rem 0; padding-top: 0.6rem;
            border-top: 2px solid #e5e7eb;
        }
        .metodo-pago select {
            width: 100%; padding: 0.65rem;
            border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 0.85rem; margin-bottom: 0.6rem;
            font-family: inherit; background: #fff;
        }
        .finalizar-btn {
            background: #059669; color: #fff;
            border: none; padding: 0.85rem;
            border-radius: 10px; font-weight: 600;
            width: 100%; cursor: pointer;
            font-size: 0.95rem; font-family: inherit;
            transition: background 0.15s;
        }
        .finalizar-btn:hover:not(:disabled) { background: #047857; }
        .finalizar-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .vaciar-btn {
            background: none; border: 1px solid #d1d5db;
            padding: 0.55rem; border-radius: 10px;
            width: 100%; margin-top: 0.5rem;
            cursor: pointer; font-size: 0.8rem;
            font-family: inherit; color: #6b7280;
        }
        .vaciar-btn:hover { background: #fef2f2; color: #dc2626; border-color: #fca5a5; }

        /* Modales */
        .modal {
            display: none; position: fixed;
            inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; padding: 1rem;
            align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff; border-radius: 16px;
            padding: 1.5rem; max-width: 420px;
            width: 100%; max-height: 90vh; overflow-y: auto;
        }
        .modal-content h3 {
            font-size: 1.1rem; margin-bottom: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .variante-opcion {
            display: flex; justify-content: space-between;
            align-items: center; padding: 0.75rem;
            border: 1px solid #e5e7eb; border-radius: 10px;
            margin-bottom: 0.5rem; cursor: pointer;
            transition: all 0.15s;
        }
        .variante-opcion:hover { border-color: #2563eb; background: #eff6ff; }
        .variante-opcion.sin-stock { opacity: 0.4; cursor: not-allowed; }
        .variante-talla { font-weight: 600; }
        .variante-precio { color: #059669; font-weight: 700; }
        .variante-stock { font-size: 0.75rem; color: #6b7280; }

        .btn-cancelar {
            width: 100%; padding: 0.65rem;
            border: 1px solid #d1d5db; border-radius: 10px;
            background: #fff; cursor: pointer;
            font-size: 0.85rem; margin-top: 0.5rem;
            font-family: inherit;
        }

        /* Modal factura */
        .factura-icono { font-size: 3rem; text-align: center; margin-bottom: 0.75rem; }
        .factura-info {
            background: #f9fafb; border-radius: 10px;
            padding: 1rem; margin: 1rem 0;
        }
        .factura-info p {
            display: flex; justify-content: space-between;
            margin-bottom: 0.4rem; font-size: 0.9rem;
        }
        .factura-info p:last-child { margin-bottom: 0; }
        .modal-buttons { display: flex; gap: 0.6rem; }
        .modal-buttons button {
            flex: 1; padding: 0.75rem;
            border: none; border-radius: 10px;
            cursor: pointer; font-weight: 600;
            font-size: 0.85rem; font-family: inherit;
        }
        .btn-imprimir { background: #2563eb; color: #fff; }
        .btn-nueva { background: #f3f4f6; color: #374151; }

        /* Toast */
        .toast {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1f2937; color: #fff;
            padding: 0.75rem 1.25rem; border-radius: 10px;
            font-size: 0.85rem; z-index: 2000;
            opacity: 0; transition: all 0.3s;
            pointer-events: none;
            max-width: 90%; text-align: center;
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }
        .toast.error { background: #dc2626; }
        .toast.success { background: #059669; }

        /* Responsive */
        @media (max-width: 900px) {
            .venta-container { grid-template-columns: 1fr; }
            .carrito-panel { position: static; }
            .grid-productos { max-height: 400px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <span>🌸</span>
            <span>Modas La 34 — Venta Rápida</span>
        </div>
        <a href="dashboard.html" class="volver-btn">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </header>

    <div class="venta-container">
        <!-- Productos -->
        <div class="panel productos-panel">
            <h2><i class="fas fa-box"></i> Productos</h2>
            <div class="buscador">
                <input type="text" id="buscador" placeholder="Buscar por nombre o código..." autocomplete="off">
            </div>
            <div class="categorias" id="categorias">
                <button class="cat-btn active" data-cat="todos">Todos</button>
                <button class="cat-btn" data-cat="vestidos">Vestidos</button>
                <button class="cat-btn" data-cat="blusas">Blusas</button>
                <button class="cat-btn" data-cat="pantalones">Pantalones</button>
                <button class="cat-btn" data-cat="deportivo">Deportivo</button>
                <button class="cat-btn" data-cat="caballero">Caballero</button>
                <button class="cat-btn" data-cat="accesorios">Accesorios</button>
            </div>
            <div class="grid-productos" id="grid-productos">
                <div style="text-align:center; padding:2rem; color:#9ca3af;">Cargando...</div>
            </div>
        </div>

        <!-- Carrito -->
        <div class="panel carrito-panel">
            <div class="carrito-header">
                <h2><i class="fas fa-cart-shopping"></i> Carrito</h2>
                <span class="carrito-badge" id="carrito-badge">0</span>
            </div>

            <div class="iva-selector">
                <label>IVA incluido en precios</label>
                <div class="iva-opciones" id="iva-opciones">
                    <div class="iva-opcion active" data-iva="0">0%</div>
                    <div class="iva-opcion" data-iva="5">5%</div>
                    <div class="iva-opcion" data-iva="19">19%</div>
                </div>
            </div>

            <div class="carrito-items" id="carrito-items">
                <div class="carrito-vacio">Carrito vacío</div>
            </div>

            <div class="carrito-resumen">
                <div class="resumen-linea">
                    <span>Base:</span>
                    <span id="subtotal">$0</span>
                </div>
                <div class="resumen-linea" id="iva-linea" style="display:none;">
                    <span>IVA <span id="iva-porcentaje">0</span>%:</span>
                    <span id="iva-valor">$0</span>
                </div>
                <div class="resumen-total">
                    <span>TOTAL</span>
                    <span id="total">$0</span>
                </div>

                <select id="metodo-pago">
                    <option value="Efectivo">💵 Efectivo</option>
                    <option value="Tarjeta Débito">💳 Tarjeta Débito</option>
                    <option value="Tarjeta Crédito">💳 Tarjeta Crédito</option>
                    <option value="Transferencia">🏦 Transferencia</option>
                    <option value="Nequi">📱 Nequi</option>
                    <option value="DaviPlata">📱 DaviPlata</option>
                </select>

                <button class="finalizar-btn" id="finalizar-btn" disabled>
                    <i class="fas fa-check"></i> Finalizar Venta
                </button>
                <button class="vaciar-btn" id="vaciar-btn">Vaciar carrito</button>
            </div>
        </div>
    </div>

    <!-- Modal variantes -->
    <div class="modal" id="modal-variantes">
        <div class="modal-content">
            <h3 id="variante-titulo"><i class="fas fa-tags"></i> Seleccionar talla</h3>
            <div id="variante-lista"></div>
            <button class="btn-cancelar" id="variante-cancelar">Cancelar</button>
        </div>
    </div>

    <!-- Modal factura -->
    <div class="modal" id="modal-factura">
        <div class="modal-content">
            <div class="factura-icono">🧾</div>
            <h3 style="justify-content:center;">Venta completada</h3>
            <div class="factura-info">
                <p><span>Total:</span> <strong id="factura-total">$0</strong></p>
                <p><span>IVA:</span> <span id="factura-iva">0%</span></p>
                <p><span>Método:</span> <span id="factura-metodo">—</span></p>
            </div>
            <div class="modal-buttons">
                <button class="btn-imprimir" id="btn-imprimir">
                    <i class="fas fa-print"></i> Imprimir
                </button>
                <button class="btn-nueva" id="btn-nueva">
                    <i class="fas fa-plus"></i> Nueva venta
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="../js/supabase-config.js"></script>
    <script>
    (function() {
        'use strict';

        // ============ ESTADO ============
        const state = {
            productos: [],
            carrito: [],
            iva: 0,
            filtroCategoria: 'todos',
            busqueda: '',
            ultimaVenta: null,
            productoPendiente: null
        };

        // ============ HELPERS ============
        const $ = (id) => document.getElementById(id);
        const fmt = (n) => '$' + Math.round(n).toLocaleString('es-CO');

        let toastTimer = null;
        function toast(msg, tipo = '') {
            const el = $('toast');
            el.textContent = msg;
            el.className = 'toast show ' + tipo;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.className = 'toast', 2500);
        }

        function getToken() {
            try {
                return JSON.parse(localStorage.getItem('admin_token'));
            } catch { return null; }
        }

        // ============ CARGA DE PRODUCTOS ============
        async function cargarProductos() {
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/vista_productos_completa?select=*`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                if (!res.ok) throw new Error('Error HTTP ' + res.status);
                state.productos = await res.json();
                renderProductos();
            } catch (e) {
                console.error(e);
                $('grid-productos').innerHTML =
                    '<div style="text-align:center; padding:2rem; color:#dc2626;">Error al cargar productos</div>';
                toast('No se pudieron cargar los productos', 'error');
            }
        }

        // ============ RENDER PRODUCTOS ============
        function renderProductos() {
            const q = state.busqueda.toLowerCase().trim();
            let lista = state.productos.filter(p => (p.stock_total || 0) > 0);

            if (state.filtroCategoria !== 'todos') {
                lista = lista.filter(p =>
                    (p.categoria || '').toLowerCase() === state.filtroCategoria
                );
            }
            if (q) {
                lista = lista.filter(p =>
                    (p.nombre || '').toLowerCase().includes(q) ||
                    (p.codigo || '').toLowerCase().includes(q)
                );
            }

            const grid = $('grid-productos');
            if (lista.length === 0) {
                grid.innerHTML =
                    '<div style="text-align:center; padding:2rem; color:#9ca3af;">Sin productos</div>';
                return;
            }

            grid.innerHTML = lista.map(p => {
                const bajo = (p.stock_total || 0) <= 3;
                return `
                    <div class="producto-card" data-id="${p.id}">
                        <div class="producto-nombre">${escapeHtml(p.nombre)}</div>
                        <div class="producto-precio">${fmt(p.precio_min || 0)}</div>
                        <div class="producto-stock ${bajo ? 'bajo' : ''}">
                            Stock: ${p.stock_total}
                        </div>
                        <div class="producto-codigo">${escapeHtml(p.codigo || '')}</div>
                    </div>`;
            }).join('');

            // Event delegation (más limpio que onclick inline)
            grid.querySelectorAll('.producto-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = Number(card.dataset.id);
                    seleccionarProducto(id);
                });
            });
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        // ============ SELECCIÓN DE PRODUCTO ============
        async function seleccionarProducto(id) {
            const producto = state.productos.find(p => p.id === id);
            if (!producto) return;

            // Cargar variantes reales desde la tabla
            let variantes = [];
            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/variantes_producto?producto_id=eq.${id}&select=*`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                if (res.ok) variantes = await res.json();
            } catch (e) {
                console.error('Error variantes:', e);
            }

            // Filtrar variantes con stock
            variantes = variantes.filter(v => {
                const colores = v.colores || [];
                const stock = colores.reduce((s, c) => s + (c.stock || 0), 0);
                return stock > 0 || (v.stock_total || 0) > 0;
            });

            if (variantes.length === 0) {
                // Sin variantes: agregar directo
                agregarAlCarrito(producto, null, producto.precio_min || 0);
                return;
            }

            if (variantes.length === 1) {
                // Una sola variante: agregar directo
                const v = variantes[0];
                const stock = stockDeVariante(v);
                agregarAlCarrito(producto, v, v.precio_venta || producto.precio_min || 0, stock);
                return;
            }

            // Múltiples variantes: mostrar modal
            state.productoPendiente = producto;
            $('variante-titulo').innerHTML =
                `<i class="fas fa-tags"></i> ${escapeHtml(producto.nombre)}`;

            $('variante-lista').innerHTML = variantes.map(v => {
                const stock = stockDeVariante(v);
                const sinStock = stock <= 0;
                return `
                    <div class="variante-opcion ${sinStock ? 'sin-stock' : ''}"
                         data-variante='${escapeAttr(JSON.stringify(v))}'>
                        <div>
                            <div class="variante-talla">Talla: ${escapeHtml(v.talla || 'Única')}</div>
                            <div class="variante-stock">Stock: ${stock}</div>
                        </div>
                        <div class="variante-precio">${fmt(v.precio_venta || producto.precio_min || 0)}</div>
                    </div>`;
            }).join('');

            $('variante-lista').querySelectorAll('.variante-opcion').forEach(el => {
                if (el.classList.contains('sin-stock')) return;
                el.addEventListener('click', () => {
                    const v = JSON.parse(el.dataset.variante);
                    const stock = stockDeVariante(v);
                    agregarAlCarrito(
                        state.productoPendiente,
                        v,
                        v.precio_venta || state.productoPendiente.precio_min || 0,
                        stock
                    );
                    cerrarModalVariantes();
                });
            });

            $('modal-variantes').classList.add('active');
        }

        function escapeAttr(s) {
            return String(s).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
        }

        function stockDeVariante(v) {
            if (typeof v.stock_total === 'number') return v.stock_total;
            const colores = v.colores || [];
            return colores.reduce((s, c) => s + (c.stock || 0), 0);
        }

        function cerrarModalVariantes() {
            $('modal-variantes').classList.remove('active');
            state.productoPendiente = null;
        }

        // ============ CARRITO ============
        function agregarAlCarrito(producto, variante, precio, stockMax) {
            const key = variante ? `v-${variante.id}` : `p-${producto.id}`;
            const existente = state.carrito.find(i => i.key === key);
            const stockReal = stockMax ?? (variante
                ? stockDeVariante(variante)
                : (producto.stock_total || 999));

            if (existente) {
                if (existente.cantidad >= stockReal) {
                    toast(`Stock máximo alcanzado (${stockReal})`, 'error');
                    return;
                }
                existente.cantidad++;
            } else {
                if (stockReal <= 0) {
                    toast('Sin stock disponible', 'error');
                    return;
                }
                state.carrito.push({
                    key,
                    id: variante?.id || producto.id,
                    producto_id: producto.id,
                    variante_id: variante?.id || null,
                    nombre: producto.nombre,
                    talla: variante?.talla || 'Única',
                    precio: Number(precio) || 0,
                    cantidad: 1,
                    stockMax: stockReal
                });
            }
            renderCarrito();
            toast(`${producto.nombre} agregado`, 'success');
        }

        function renderCarrito() {
            const totalItems = state.carrito.reduce((s, i) => s + i.cantidad, 0);
            $('carrito-badge').textContent = totalItems;

            const cont = $('carrito-items');
            if (state.carrito.length === 0) {
                cont.innerHTML = '<div class="carrito-vacio">Carrito vacío</div>';
                $('finalizar-btn').disabled = true;
                $('subtotal').textContent = '$0';
                $('total').textContent = '$0';
                $('iva-linea').style.display = 'none';
                return;
            }

            $('finalizar-btn').disabled = false;

            cont.innerHTML = state.carrito.map((item, idx) => `
                <div class="carrito-item">
                    <div class="item-info">
                        <div class="item-nombre">${escapeHtml(item.nombre)}</div>
                        <div class="item-detalle">Talla: ${escapeHtml(item.talla)}</div>
                    </div>
                    <div class="item-cantidad">
                        <button data-accion="dec" data-idx="${idx}">−</button>
                        <span>${item.cantidad}</span>
                        <button data-accion="inc" data-idx="${idx}">+</button>
                    </div>
                    <div class="item-precio">${fmt(item.precio * item.cantidad)}</div>
                    <button class="item-eliminar" data-accion="del" data-idx="${idx}">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');

            cont.querySelectorAll('button[data-accion]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = Number(btn.dataset.idx);
                    const accion = btn.dataset.accion;
                    if (accion === 'inc') cambiarCantidad(idx, 1);
                    else if (accion === 'dec') cambiarCantidad(idx, -1);
                    else if (accion === 'del') eliminarDelCarrito(idx);
                });
            });

            calcularTotales();
        }

        function calcularTotales() {
            const total = state.carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
            const ivaPct = state.iva;

            if (ivaPct > 0) {
                const base = total / (1 + ivaPct / 100);
                const iva = total - base;
                $('iva-linea').style.display = 'flex';
                $('iva-porcentaje').textContent = ivaPct;
                $('iva-valor').textContent = fmt(iva);
                $('subtotal').textContent = fmt(base);
            } else {
                $('iva-linea').style.display = 'none';
                $('subtotal').textContent = fmt(total);
            }
            $('total').textContent = fmt(total);
        }

        function cambiarCantidad(idx, delta) {
            const item = state.carrito[idx];
            if (!item) return;
            const nueva = item.cantidad + delta;
            if (nueva <= 0) { eliminarDelCarrito(idx); return; }
            if (nueva > item.stockMax) {
                toast(`Stock máximo: ${item.stockMax}`, 'error');
                return;
            }
            item.cantidad = nueva;
            renderCarrito();
        }

        function eliminarDelCarrito(idx) {
            state.carrito.splice(idx, 1);
            renderCarrito();
        }

        function vaciarCarrito() {
            if (state.carrito.length === 0) return;
            if (!confirm('¿Vaciar el carrito?')) return;
            state.carrito = [];
            renderCarrito();
        }

        // ============ FINALIZAR VENTA ============
        async function finalizarVenta() {
            if (state.carrito.length === 0) return;

            const token = getToken();
            if (!token?.access_token) {
                toast('Sesión expirada. Vuelve a iniciar sesión.', 'error');
                return;
            }

            const metodoPago = $('metodo-pago').value;
            const total = state.carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
            const base = state.iva > 0 ? total / (1 + state.iva / 100) : total;
            const iva = total - base;

            if (!confirm(`¿Confirmar venta por ${fmt(total)}?`)) return;

            const btn = $('finalizar-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';

            try {
                // 1) Obtener usuario actual
                const userRes = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token.access_token}`
                    }
                });
                if (!userRes.ok) throw new Error('Sesión inválida');
                const user = await userRes.json();

                // 2) Crear la venta
                const ventaData = {
                    total: total,
                    subtotal: base,
                    iva: iva,
                    iva_porcentaje: state.iva,
                    metodo_pago: metodoPago,
                    productos: state.carrito
                        .map(i => `${i.cantidad}x ${i.nombre} (${i.talla})`)
                        .join(', '),
                    vendedor_id: user.id
                };

                const ventaRes = await fetch(`${SUPABASE_URL}/rest/v1/ventas`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token.access_token}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(ventaData)
                });

                if (!ventaRes.ok) {
                    const err = await ventaRes.text();
                    throw new Error('Error al crear venta: ' + err);
                }

                const ventaArr = await ventaRes.json();
                const ventaId = Array.isArray(ventaArr) ? ventaArr[0]?.id : ventaArr?.id;

                // 3) Registrar detalle (si la tabla existe)
                // Si tienes tabla 'detalle_ventas', descomenta este bloque
                /*
                for (const item of state.carrito) {
                    await fetch(`${SUPABASE_URL}/rest/v1/detalle_ventas`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${token.access_token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            venta_id: ventaId,
                            producto_id: item.producto_id,
                            variante_id: item.variante_id,
                            cantidad: item.cantidad,
                            precio_unitario: item.precio,
                            subtotal: item.precio * item.cantidad
                        })
                    });
                }
                */

                // 4) Descontar stock (solo variantes con variante_id)
                const erroresStock = [];
                for (const item of state.carrito) {
                    if (!item.variante_id) continue;
                    try {
                        // Leer variante actual
                        const varRes = await fetch(
                            `${SUPABASE_URL}/rest/v1/variantes_producto?id=eq.${item.variante_id}&select=*`,
                            { headers: { 'apikey': SUPABASE_KEY } }
                        );
                        if (!varRes.ok) throw new Error('No se pudo leer variante');
                        const varArr = await varRes.json();
                        if (!varArr.length) continue;

                        const v = varArr[0];
                        const stockActual = stockDeVariante(v);
                        const nuevoStock = Math.max(0, stockActual - item.cantidad);

                        // Recalcular colores para reflejar descuento
                        let colores = v.colores || [];
                        let restante = item.cantidad;
                        colores = colores.map(c => {
                            if (restante <= 0) return c;
                            const desc = Math.min(c.stock || 0, restante);
                            restante -= desc;
                            return { ...c, stock: (c.stock || 0) - desc };
                        });

                        const patchRes = await fetch(
                            `${SUPABASE_URL}/rest/v1/variantes_producto?id=eq.${item.variante_id}`,
                            {
                                method: 'PATCH',
                                headers: {
                                    'apikey': SUPABASE_KEY,
                                    'Authorization': `Bearer ${token.access_token}`,
                                    'Content-Type': 'application/json',
                                    'Prefer': 'return=minimal'
                                },
                                body: JSON.stringify({
                                    stock_total: nuevoStock,
                                    colores: colores
                                })
                            }
                        );
                        if (!patchRes.ok) throw new Error('No se pudo actualizar stock');
                    } catch (e) {
                        console.error('Stock:', e);
                        erroresStock.push(item.nombre);
                    }
                }

                // 5) Guardar última venta y mostrar modal
                state.ultimaVenta = {
                    id: ventaId,
                    items: state.carrito.map(i => ({ ...i })),
                    total,
                    base,
                    iva,
                    ivaPct: state.iva,
                    metodo: metodoPago,
                    fecha: new Date()
                };

                $('factura-total').textContent = fmt(total);
                $('factura-iva').textContent =
                    state.iva > 0 ? `${state.iva}%` : 'Exento';
                $('factura-metodo').textContent = metodoPago;
                $('modal-factura').classList.add('active');

                // 6) Limpiar carrito y recargar productos
                state.carrito = [];
                renderCarrito();

                if (erroresStock.length > 0) {
                    toast(
                        `Venta guardada. Stock no actualizado en: ${erroresStock.join(', ')}`,
                        'error'
                    );
                } else {
                    toast('Venta registrada correctamente', 'success');
                }

                await cargarProductos();

            } catch (e) {
                console.error(e);
                toast(e.message || 'Error al procesar la venta', 'error');
            } finally {
                btn.disabled = state.carrito.length === 0;
                btn.innerHTML = '<i class="fas fa-check"></i> Finalizar Venta';
            }
        }

        // ============ IMPRIMIR FACTURA ============
        function imprimirFactura() {
            const v = state.ultimaVenta;
            if (!v) return;

            const fecha = v.fecha;
            const fechaStr =
                fecha.toLocaleDateString('es-CO') + ' ' +
                fecha.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });

            const html = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Factura ${v.id || ''}</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Courier New', monospace;
        max-width: 80mm; margin: 0 auto; padding: 8px;
        font-size: 11px; color: #000;
    }
    .center { text-align: center; }
    .bold { font-weight: bold; }
    .sep { border-top: 1px dashed #000; margin: 6px 0; }
    .titulo { font-size: 14px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 2px 0; vertical-align: top; }
    th { text-align: left; font-size: 10px; border-bottom: 1px solid #000; }
    .right { text-align: right; }
    .total { font-size: 13px; font-weight: bold; }
    .footer { font-size: 10px; margin-top: 12px; }
</style>
</head>
<body>
    <div class="center">
        <div class="titulo">MODAS LA 34</div>
        <div>NIT: 123.456.789-0</div>
        <div>${fechaStr}</div>
        ${v.id ? `<div>Factura #${v.id}</div>` : ''}
    </div>
    <div class="sep"></div>
    <table>
        <thead>
            <tr>
                <th>Cant</th>
                <th>Producto</th>
                <th class="right">Valor</th>
            </tr>
        </thead>
        <tbody>
            ${v.items.map(i => `
                <tr>
                    <td>${i.cantidad}</td>
                    <td>${escapeHtml(i.nombre)}<br><small>(${escapeHtml(i.talla)})</small></td>
                    <td class="right">${fmt(i.precio * i.cantidad)}</td>
                </tr>
            `).join('')}
        </tbody>
    </table>
    <div class="sep"></div>
    <table>
        <tr>
            <td>Base:</td>
            <td class="right">${fmt(v.base)}</td>
        </tr>
        ${v.ivaPct > 0 ? `
        <tr>
            <td>IVA ${v.ivaPct}%:</td>
            <td class="right">${fmt(v.iva)}</td>
        </tr>` : ''}
        <tr class="total">
            <td>TOTAL:</td>
            <td class="right">${fmt(v.total)}</td>
        </tr>
        <tr>
            <td>Pago:</td>
            <td class="right">${escapeHtml(v.metodo)}</td>
        </tr>
    </table>
    <div class="sep"></div>
    <div class="center footer">
        <p>¡Gracias por su compra!</p>
        <p>Modas La 34</p>
    </div>
    <script>
        window.onload = function() {
            window.print();
            window.onafterprint = function() { window.close(); };
        };
    <\/script>
</body>
</html>`;

            const win = window.open('', '_blank', 'width=400,height=600');
            if (!win) {
                toast('Permite ventanas emergentes para imprimir', 'error');
                return;
            }
            win.document.open();
            win.document.write(html);
            win.document.close();
        }

        function nuevaVenta() {
            $('modal-factura').classList.remove('active');
            state.ultimaVenta = null;
            $('metodo-pago').value = 'Efectivo';
        }

        // ============ EVENTOS ============
        function configurarEventos() {
            // Categorías
            $('categorias').addEventListener('click', (e) => {
                const btn = e.target.closest('.cat-btn');
                if (!btn) return;
                document.querySelectorAll('.cat-btn')
                    .forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.filtroCategoria = btn.dataset.cat;
                renderProductos();
            });

            // Buscador con debounce
            let busqTimer = null;
            $('buscador').addEventListener('input', (e) => {
                clearTimeout(busqTimer);
                busqTimer = setTimeout(() => {
                    state.busqueda = e.target.value;
                    renderProductos();
                }, 200);
            });

            // Selector IVA
            $('iva-opciones').addEventListener('click', (e) => {
                const opt = e.target.closest('.iva-opcion');
                if (!opt) return;
                document.querySelectorAll('.iva-opcion')
                    .forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                state.iva = parseInt(opt.dataset.iva, 10) || 0;
                calcularTotales();
            });

            // Finalizar / vaciar
            $('finalizar-btn').addEventListener('click', finalizarVenta);
            $('vaciar-btn').addEventListener('click', vaciarCarrito);

            // Modal variantes
            $('variante-cancelar').addEventListener('click', cerrarModalVariantes);
            $('modal-variantes').addEventListener('click', (e) => {
                if (e.target.id === 'modal-variantes') cerrarModalVariantes();
            });

            // Modal factura
            $('btn-imprimir').addEventListener('click', imprimirFactura);
            $('btn-nueva').addEventListener('click', nuevaVenta);

            // Atajos de teclado (útil en caja)
            document.addEventListener('keydown', (e) => {
                // F2 = finalizar venta
                if (e.key === 'F2') {
                    e.preventDefault();
                    if (! $('finalizar-btn').disabled) finalizarVenta();
                }
                // F4 = enfocar buscador
                if (e.key === 'F4') {
                    e.preventDefault();
                    $('buscador').focus();
                }
                // ESC = cerrar modales
                if (e.key === 'Escape') {
                    cerrarModalVariantes();
                    if (state.ultimaVenta) nuevaVenta();
                }
                // Enter en buscador con 1 resultado → agregar
                if (e.key === 'Enter' && document.activeElement === $('buscador')) {
                    const cards = document.querySelectorAll('.producto-card');
                    if (cards.length === 1) cards[0].click();
                }
            });
        }

        // ============ INIT ============
        async function init() {
            configurarEventos();
            await cargarProductos();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
