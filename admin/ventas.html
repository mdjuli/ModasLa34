<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punto de Venta · ModasLa34</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#f5f3ef; }
    .toast { animation: in .2s ease-out; }
    @keyframes in { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
  </style>
</head>
<body class="min-h-screen text-stone-800">
  <header class="bg-stone-900 text-stone-100">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-semibold tracking-wide">ModasLa34 · Caja</h1>
        <p class="text-xs text-stone-400">Escanea el código de barras o busca por nombre</p>
      </div>
      <nav class="flex items-center gap-2 text-sm">
        <button id="btnHistorial" class="px-3 py-1.5 rounded bg-stone-700 hover:bg-stone-600">Ventas de hoy</button>
        <a href="dashboard.html" class="px-3 py-1.5 rounded bg-stone-700 hover:bg-stone-600">Panel</a>
        <span id="usuarioNombre" class="text-stone-300 hidden md:inline"></span>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 grid lg:grid-cols-5 gap-4">
    <!-- Escáner + resultados -->
    <section class="lg:col-span-3 space-y-3">
      <div class="bg-white rounded-xl shadow-sm p-4">
        <label for="scanInput" class="block text-sm font-medium mb-1">Código de barras / búsqueda</label>
        <!-- Este input siempre se mantiene enfocado para el lector USB -->
        <input id="scanInput" type="text" autocomplete="off" autofocus
               placeholder="Escanea o escribe y presiona Enter"
               class="w-full text-lg px-4 py-3 border-2 border-stone-300 rounded-lg focus:border-stone-800 focus:outline-none" />
        <p id="scanHint" class="text-xs text-stone-500 mt-1">Enter agrega el producto al carrito.</p>
      </div>
      <div id="resultados" class="grid sm:grid-cols-2 gap-2"></div>
    </section>

    <!-- Carrito -->
    <section class="lg:col-span-2 bg-white rounded-xl shadow-sm p-4 flex flex-col">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-semibold">Carrito</h2>
        <button id="btnVaciar" class="text-xs text-red-700 hover:underline">Vaciar</button>
      </div>
      <div id="carrito" class="flex-1 divide-y min-h-[160px] max-h-[44vh] overflow-y-auto"></div>

      <div class="mt-3 space-y-2 border-t pt-3 text-sm">
        <div class="grid grid-cols-2 gap-2">
          <label class="block">Cliente
            <select id="selCliente" class="mt-1 w-full border rounded px-2 py-1.5"></select>
          </label>
          <label class="block">Método de pago
            <select id="selPago" class="mt-1 w-full border rounded px-2 py-1.5">
              <option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option>
            </select>
          </label>
          <label class="block">IVA (%)
            <select id="selIva" class="mt-1 w-full border rounded px-2 py-1.5">
              <option value="0">0% (precios finales)</option>
              <option value="19">19% (se suma al subtotal)</option>
            </select>
          </label>
          <label id="boxRecibido" class="block">Efectivo recibido
            <input id="inpRecibido" type="number" min="0" step="100" class="mt-1 w-full border rounded px-2 py-1.5" />
          </label>
        </div>
        <label class="flex items-center gap-2 text-xs text-stone-600">
          <input id="chkAsiento" type="checkbox" checked /> Generar asiento contable automático
        </label>
        <div class="flex justify-between"><span>Subtotal</span><span id="lblSubtotal">$0</span></div>
        <div class="flex justify-between"><span>IVA</span><span id="lblIva">$0</span></div>
        <div class="flex justify-between text-xl font-bold"><span>Total</span><span id="lblTotal">$0</span></div>
        <div id="boxCambio" class="flex justify-between text-stone-600"><span>Cambio</span><span id="lblCambio">$0</span></div>
        <button id="btnCobrar" class="w-full py-3 rounded-lg bg-stone-900 text-white font-semibold hover:bg-stone-700 disabled:opacity-40" disabled>
          Registrar venta
        </button>
      </div>
    </section>
  </main>

  <!-- Modal genérico -->
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-5" id="modalBody"></div>
  </div>
  <div id="toasts" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

  <script type="module" src="../js/ventas.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('../js/sw.js').catch(()=>{});</script>
</body>
</html>
